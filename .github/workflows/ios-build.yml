name: Build Unsigned IPA

on:
  push:
    branches: [ main, feat/settings-style-redesign ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build Configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

env:
  PROJECT_PATH: demo.xcodeproj
  SCHEME_NAME: demo

jobs:
  build:
    name: Build and Archive (${{ matrix.tier }})
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: iOS18
            min_version: "18.0"
            flag: "IOS18 IOS17 IOS16"
            ipa_name: demo-unsigned-iOS18.ipa
          - tier: iOS17
            min_version: "17.0"
            flag: "IOS17 IOS16"
            ipa_name: demo-unsigned-iOS17.ipa
          - tier: iOS16
            min_version: "16.0"
            flag: "IOS16"
            ipa_name: demo-unsigned-iOS16.ipa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Clean Build Directory
        run: |
          rm -rf build/
          mkdir -p build/

      - name: Archive App (${{ matrix.tier }})
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "${{ github.event.inputs.build_configuration || 'Release' }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/demo-${{ matrix.tier }}.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.min_version }} \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="${{ matrix.flag }}" \
            | tee "build/xcodebuild-${{ matrix.tier }}.log"

      - name: Create Unsigned IPA (${{ matrix.tier }})
        run: |
          PAYLOAD_PATH="build/Payload-${{ matrix.tier }}"
          ARCHIVE_PATH="build/demo-${{ matrix.tier }}.xcarchive"
          rm -rf "$PAYLOAD_PATH"
          mkdir -p "$PAYLOAD_PATH/Payload"

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive"
            find "$ARCHIVE_PATH" -name "*.app" -type d
            exit 1
          fi

          cp -R "$APP_PATH" "$PAYLOAD_PATH/Payload/"

          cd "$PAYLOAD_PATH"
          zip -r "../${{ matrix.ipa_name }}" Payload/

      - name: Get App Version
        id: app_version
        run: |
          APP_VERSION=$(xcodebuild -project "$PROJECT_PATH" -showBuildSettings -scheme "$SCHEME_NAME" | grep -E 'MARKETING_VERSION' | awk '{print $3}' | head -1)
          BUILD_NUMBER=$(xcodebuild -project "$PROJECT_PATH" -showBuildSettings -scheme "$SCHEME_NAME" | grep -E 'CURRENT_PROJECT_VERSION' | awk '{print $3}' | head -1)

          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Upload IPA Artifact (${{ matrix.tier }})
        uses: actions/upload-artifact@v4
        with:
          name: demo-unsigned-ipa-${{ matrix.tier }}
          path: build/${{ matrix.ipa_name }}
          retention-days: 30

      - name: Upload Archive Artifact (${{ matrix.tier }})
        if: matrix.tier == 'iOS16'
        uses: actions/upload-artifact@v4
        with:
          name: demo-archive-${{ matrix.tier }}-v${{ steps.app_version.outputs.app_version }}
          path: build/demo-${{ matrix.tier }}.xcarchive
          retention-days: 7

      - name: Upload Build Logs (${{ matrix.tier }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.tier }}-${{ github.run_number }}
          path: |
            build/xcodebuild-${{ matrix.tier }}.log
          retention-days: 7

  release:
    name: Create Pre-Release
    runs-on: macos-15
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All IPA Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: demo-unsigned-ipa-*
          merge-multiple: true
          path: ./release/

      - name: List Release Files
        run: ls -lh ./release/

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: demo prerelease ${{ github.run_number }}
          files: |
            ./release/demo-unsigned-iOS18.ipa
            ./release/demo-unsigned-iOS17.ipa
            ./release/demo-unsigned-iOS16.ipa
          prerelease: true
          draft: false
          generate_release_notes: true
