name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build Configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

env:
  PROJECT_PATH: demo.xcodeproj
  SCHEME_NAME: demo
  ARCHIVE_PATH: build/demo.xcarchive
  PAYLOAD_PATH: build/Payload
  IPA_NAME: demo-unsigned.ipa

jobs:
  build:
    name: Build and Archive
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Clean Build Directory
        run: |
          rm -rf build/
          mkdir -p build/

      - name: Archive App
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "${{ github.event.inputs.build_configuration || 'Release' }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee xcodebuild.log

      - name: Create Unsigned IPA
        run: |
          mkdir -p "$PAYLOAD_PATH"

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive"
            find "$ARCHIVE_PATH" -name "*.app" -type d
            exit 1
          fi

          cp -R "$APP_PATH" "$PAYLOAD_PATH/"

          cd build
          zip -r "$IPA_NAME" Payload/

      - name: Get App Version
        id: app_version
        run: |
          APP_VERSION=$(xcodebuild -project "$PROJECT_PATH" -showBuildSettings -scheme "$SCHEME_NAME" | grep -E 'MARKETING_VERSION' | awk '{print $3}' | head -1)
          BUILD_NUMBER=$(xcodebuild -project "$PROJECT_PATH" -showBuildSettings -scheme "$SCHEME_NAME" | grep -E 'CURRENT_PROJECT_VERSION' | awk '{print $3}' | head -1)

          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-unsigned-ipa
          path: build/${{ env.IPA_NAME }}
          retention-days: 30

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-archive-v${{ steps.app_version.outputs.app_version }}
          path: build/demo.xcarchive
          retention-days: 7

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            xcodebuild.log
            build/
          retention-days: 7

  release:
    name: Create Pre-Release
    runs-on: macos-15
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-unsigned-ipa
          path: ./release/

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: demo prerelease ${{ github.run_number }}
          files: |
            ./release/${{ env.IPA_NAME }}
          prerelease: true
          draft: false
          generate_release_notes: true